<body data-page="test">
  <audio id="ambience" loop preload="none">
    <source src="assets/audio/ambience.wav" type="audio/wav" />
  </audio>

  <header class="chrome">
    <a class="brand" href="index.html">KAIROS<span class="dot">.</span></a>
    <nav>
      <a class="uline" href="about.html">ABOUT THE AGENT</a>
      <a class="uline" href="index.html">DECISION INDEX</a>
      <a class="uline" href="results.html">RESULTS</a>
      <a class="uline" href="workflow.html">WORKFLOW</a>
      <a class="uline active" href="test.html">TEST BENCH</a>
    </nav>
    <div class="right">
      <div>
        <a href="about.html#contact">CONTACT</a>
        <span class="lang">EN</span>
      </div>
      <button id="soundToggle">SOUND — <span id="soundWord">OFF</span><span class="eq"><i></i><i></i><i></i></span></button>
    </div>
  </header>

  <main id="stage">
    <div class="tb2">
      <header class="tb2-head">
        <h1 class="tb2-title">Test bench</h1>
        <p class="tb2-sub">Real engine output. Change a request, run it, see the verdict.</p>
      </header>

      <section class="tb2-panel" aria-label="Run a request">
        <div class="tb2-tabs" role="tablist">
          <button class="tb2-tab on" data-tab="baseline" role="tab" aria-selected="true">Baseline</button>
          <button class="tb2-tab" data-tab="live" role="tab" aria-selected="false">Live engine</button>
        </div>

        <div class="tb2-quick" id="tb2Quick"></div>

        <div class="tb2-pane on" data-pane="baseline">
          <div class="tb2-bar">
            <input id="tb2Pick" list="tbList" placeholder="request id" />
            <datalist id="tbList"></datalist>
            <button id="tb2Run" class="tb2-btn primary">Run</button>
            <button id="tb2Random" class="tb2-btn">Random</button>
            <label class="tb2-toggle"><input type="checkbox" id="tb2Cmp" checked /> vs output.csv</label>
          </div>
          <div id="tb2Out"></div>
        </div>

        <div class="tb2-pane" data-pane="live">
          <div class="tb-live" id="tbLive"></div>
        </div>

        <details class="tb2-details">
          <summary>Custom test cases</summary>
          <div class="tb-form">
            <div class="tb-field"><i>REQUEST ID</i><input id="cfId" placeholder="request_999" /></div>
            <div class="tb-field"><i>EXPECTED</i>
              <select id="cfExp">
                <option value="any">any verdict</option>
                <option value="affordable">affordable somehow</option>
                <option value="full_now">full payment now</option>
                <option value="not_affordable">not affordable</option>
              </select>
            </div>
            <button id="cfAdd" class="tb2-btn">Add</button>
          </div>
          <div id="cfList" class="tb-cases"></div>
        </details>
      </section>
    </div>
  </main>

  <script src="assets/js/data.js?v=10"></script>
  <script src="assets/js/decisions.js?v=10"></script>
